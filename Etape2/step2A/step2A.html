<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List - Nouvelle Tâche</title>
    <link rel="stylesheet" href="step2A.css">
</head>
<body>

    <!-- EN-TÊTE -->
    <header>
        <h1>Ma To-Do List</h1>
        <p>Ajouter une nouvelle tâche</p>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main>
        <section>
            <form action="#" method="POST">
                
                <!-- GROUPE 1 : Informations générales -->
                <fieldset>
                    <legend>Informations générales</legend>
                    
                    <div class="form-group">
                        <label for="titleTask">Titre de la tâche *</label>
                        <input type="text" id="titleTask" name="titleTask" 
                               placeholder="Ex: Rédaction du mémoire" required>
                    </div>

                    <div class="form-group">
                        <label for="descriptionTask">Description courte</label>
                        <input type="text" id="descriptionTask" name="descriptionTask" 
                               placeholder="Ex: Validation de cursus">
                    </div>

                    <div class="form-group">
                        <label for="detailsTask">Détails / Contexte</label>
                        <textarea id="detailsTask" name="detailsTask" rows="4" 
                                  placeholder="Décrivez les chapitres ou le contexte..."></textarea>
                    </div>
                </fieldset>

                <!-- GROUPE 2 : Planification -->
                <fieldset>
                    <legend>Planification</legend>

                    <div class="form-group">
                        <label for="creationDateTask">Date de création</label>
                        <input type="date" id="creationDateTask" name="creationDateTask" value="2026-09-03">
                    </div>

                    <div class="form-group">
                        <label for="startDateTask">Date de début *</label>
                        <input type="date" id="startDateTask" name="startDateTask" required>
                    </div>

                    <div class="form-group">
                        <label for="dueDateTask">Date d'échéance *</label>
                        <input type="date" id="dueDateTask" name="dueDateTask" required>
                    </div>

                    <div class="form-group">
                        <label for="durationTask">Durée estimée</label>
                        <input type="text" id="durationTask" name="durationTask" 
                               placeholder="Ex: 9 mois">
                    </div>

                    <div class="form-group">
                        <label for="planificationTask">Type de planification</label>
                        <select id="planificationTask" name="planificationTask">
                            <option value="">-- Choisir --</option>
                            <option value="Mensuelle">Mensuelle</option>
                            <option value="Hebdomadaire">Hebdomadaire</option>
                            <option value="Quotidienne">Quotidienne</option>
                            <option value="Ponctuelle">Ponctuelle</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="targetCompletionTask">Achèvement souhaité</label>
                        <input type="text" id="targetCompletionTask" name="targetCompletionTask" 
                               placeholder="Ex: Dépôt et soutenance">
                    </div>
                </fieldset>

                <!-- GROUPE 3 : Catégorisation (Variables) -->
                <fieldset>
                    <legend>Catégorisation</legend>

                    <div class="form-group">
                        <label for="idPriority">Priorité *</label>
                        <select id="idPriority" name="idPriority" required>
                            <option value="">-- Choisir une priorité --</option>
                            <option value="1">Urgente et importante</option>
                            <option value="2">Importante</option>
                            <option value="3">Urgente (non importante)</option>
                            <option value="4">Moyenne</option>
                            <option value="5">Peu importante</option>
                            <option value="6">Délais non-négociables</option>
                            <option value="7">En attente / Bloquée</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="idStatus">Statut *</label>
                        <select id="idStatus" name="idStatus" required>
                            <option value="">-- Choisir un statut --</option>
                            <option value="1">En cours</option>
                            <option value="2">À faire</option>
                            <option value="3">Terminé</option>
                            <option value="4">En attente de validation</option>
                            <option value="5">À déléguer</option>
                            <option value="6">À revoir</option>
                            <option value="7">À planifier</option>
                            <option value="8">À augmenter / à diminuer</option>
                            <option value="9">Annulé</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="idAccomplissement">Niveau d'accomplissement</label>
                        <select id="idAccomplissement" name="idAccomplissement">
                            <option value="">-- Choisir un niveau --</option>
                            <option value="1">0%</option>
                            <option value="2">25%</option>
                            <option value="3">50%</option>
                            <option value="4">75%</option>
                            <option value="5">100%</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="idCategory">Catégorie *</label>
                        <select id="idCategory" name="idCategory" required>
                            <option value="">-- Choisir une catégorie --</option>
                            <option value="1">Recherche</option>
                            <option value="2">Gestion de projet</option>
                            <option value="3">Travaux pratiques</option>
                            <option value="4">Rapport de stage</option>
                            <option value="5">Projet E-Learning</option>
                        </select>
                    </div>
                </fieldset>

                <!-- BOUTON -->
                <div class="form-actions">
                    <button type="submit">Enregistrer la tâche</button>
                </div>
            </form>
        </section>
    </main>

    <!-- PIED DE PAGE -->
    <footer>
        <p>&copy; 2026 - Raoul FOSSUA TINDO</p>
        <p>Projet To-Do List - Unistra</p>
    </footer>

</body>
</html>
