<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List - Formulaire Dynamique (2B)</title>
    <link rel="stylesheet" href="../step2A/step2A.css">
</head>
<body>

    <header>
        <h1>Ma To-Do List</h1>
        <p>Ajouter une nouvelle tâche</p>
        <nav>
            <a href="../step3/step3.html" style="color: white; text-decoration: underline;">[ Voir mon Dashboard ]</a>
        </nav>
    </header>

    <main>
        <section>
            <!-- On ajoute un ID au formulaire pour le JS -->
            <form id="taskForm">
                
                <fieldset>
                    <legend>Informations générales</legend>
                    <div class="form-group">
                        <label for="titleTask">Titre de la tâche *</label>
                        <input type="text" id="titleTask" required>
                    </div>
                    <div class="form-group">
                        <label for="descriptionTask">Description courte</label>
                        <input type="text" id="descriptionTask">
                    </div>
                    <div class="form-group">
                        <label for="detailsTask">Détails / Contexte</label>
                        <textarea id="detailsTask" rows="4"></textarea>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Planification</legend>
                    <div class="form-group">
                        <label for="creationDateTask">Date de création</label>
                        <input type="date" id="creationDateTask" value="2026-09-03">
                    </div>
                    <div class="form-group">
                        <label for="startDateTask">Date de début *</label>
                        <input type="date" id="startDateTask" required>
                    </div>
                    <div class="form-group">
                        <label for="dueDateTask">Date d'échéance *</label>
                        <input type="date" id="dueDateTask" required>
                    </div>
                    <div class="form-group">
                        <label for="durationTask">Durée estimée</label>
                        <input type="text" id="durationTask">
                    </div>
                    <div class="form-group">
                        <label for="planificationTask">Type de planification</label>
                        <select id="planificationTask">
                            <option value="">-- Choisir --</option>
                            <option value="Mensuelle">Mensuelle</option>
                            <option value="Hebdomadaire">Hebdomadaire</option>
                            <option value="Quotidienne">Quotidienne</option>
                            <option value="Ponctuelle">Ponctuelle</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="targetCompletionTask">Achèvement souhaité</label>
                        <input type="text" id="targetCompletionTask">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Catégorisation</legend>
                    <div class="form-group">
                        <label for="idPriority">Priorité *</label>
                        <select id="idPriority" required>
                            <option value="">-- Choisir --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="idStatus">Statut *</label>
                        <select id="idStatus" required>
                            <option value="">-- Choisir --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="idAccomplissement">Niveau d'accomplissement</label>
                        <select id="idAccomplissement">
                            <option value="">-- Choisir --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="idCategory">Catégorie *</label>
                        <select id="idCategory" required>
                            <option value="">-- Choisir --</option>
                        </select>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <!-- Bouton qui appelle la fonction JS -->
                    <button type="button" onclick="saveTask()">Enregistrer la tâche</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Raoul FOSSUA TINDO</p>
    </footer>

    <script>
        /* 1. DONNÉES JSON (Pour remplir les listes) */
        let prioritiesList = [
            { "idPriority": 1, "priorityName": "Urgente et importante" },
            { "idPriority": 2, "priorityName": "Importante" },
            { "idPriority": 3, "priorityName": "Urgente (non importante)" },
            { "idPriority": 4, "priorityName": "Moyenne" },
            { "idPriority": 5, "priorityName": "Peu importante" },
            { "idPriority": 6, "priorityName": "Délais non-négociables" },
            { "idPriority": 7, "priorityName": "En attente / Bloquée" }
        ];
        let statusList = [
            { "idStatus": 1, "statusName": "En cours" }, { "idStatus": 2, "statusName": "À faire" },
            { "idStatus": 3, "statusName": "Terminé" }, { "idStatus": 4, "statusName": "En attente de validation" },
            { "idStatus": 5, "statusName": "À déléguer" }, { "idStatus": 6, "statusName": "À revoir" },
            { "idStatus": 7, "statusName": "À planifier" }, { "idStatus": 8, "statusName": "À augmenter / à diminuer" },
            { "idStatus": 9, "statusName": "Annulé" }
        ];
        let accomplissementList = [
            { "idAccomplissement": 1, "accomplissementName": "0%" }, { "idAccomplissement": 2, "accomplissementName": "25%" },
            { "idAccomplissement": 3, "accomplissementName": "50%" }, { "idAccomplissement": 4, "accomplissementName": "75%" },
            { "idAccomplissement": 5, "accomplissementName": "100%" }
        ];
        let categoriesList = [
            { "idCategory": 1, "categoryName": "Recherche" }, { "idCategory": 2, "categoryName": "Gestion de projet" },
            { "idCategory": 3, "categoryName": "Travaux pratiques" }, { "idCategory": 4, "categoryName": "Rapport de stage" },
            { "idCategory": 5, "categoryName": "Projet E-Learning" }
        ];

        /* 2. REMPLISSAGE DYNAMIQUE DES SELECTS */
        document.onreadystatechange = function () {
            if (document.readyState === "complete") {
                prioritiesList.forEach(item => document.getElementById('idPriority').insertAdjacentHTML('beforeend', `<option value="${item.idPriority}">${item.priorityName}</option>`));
                statusList.forEach(item => document.getElementById('idStatus').insertAdjacentHTML('beforeend', `<option value="${item.idStatus}">${item.statusName}</option>`));
                accomplissementList.forEach(item => document.getElementById('idAccomplissement').insertAdjacentHTML('beforeend', `<option value="${item.idAccomplissement}">${item.accomplissementName}</option>`));
                categoriesList.forEach(item => document.getElementById('idCategory').insertAdjacentHTML('beforeend', `<option value="${item.idCategory}">${item.categoryName}</option>`));
            }
        };

        /* 3. FONCTION D'ENREGISTREMENT DANS LE LOCALSTORAGE */
        function saveTask() {
            // a) Récupérer les valeurs du formulaire
            let newTask = {
                idTask: 0, // On va le calculer juste après
                titleTask: document.getElementById('titleTask').value,
                descriptionTask: document.getElementById('descriptionTask').value,
                detailsTask: document.getElementById('detailsTask').value,
                creationDateTask: document.getElementById('creationDateTask').value,
                startDateTask: document.getElementById('startDateTask').value,
                dueDateTask: document.getElementById('dueDateTask').value,
                durationTask: document.getElementById('durationTask').value,
                planificationTask: document.getElementById('planificationTask').value,
                targetCompletionTask: document.getElementById('targetCompletionTask').value,
                idPriority: parseInt(document.getElementById('idPriority').value),
                idStatus: parseInt(document.getElementById('idStatus').value),
                idAccomplissement: parseInt(document.getElementById('idAccomplissement').value) || null,
                idCategory: parseInt(document.getElementById('idCategory').value),
                validTask: "1"
            };

            // b) Vérification basique (le navigateur le fait déjà avec "required", mais on s'assure)
            if (!newTask.titleTask || !newTask.idPriority || !newTask.idStatus || !newTask.idCategory) {
                alert("Veuillez remplir tous les champs obligatoires (*).");
                return;
            }

            // c) Lire le localStorage pour voir s'il y a déjà des tâches
            let tasksListString = localStorage.getItem('tasksList');
            let tasksList = [];
            
            if (tasksListString != null) {
                tasksList = JSON.parse(tasksListString);
            }

            // d) Générer le nouvel identifiant (clé primaire)
            // Si le tableau est vide, length = 0, donc idTask = 1
            newTask.idTask = tasksList.length + 1;

            // e) Ajouter la nouvelle tâche au tableau
            tasksList.push(newTask);

            // f) Sauvegarder le tableau mis à jour dans le localStorage
            localStorage.setItem('tasksList', JSON.stringify(tasksList));

            alert("Tâche enregistrée avec succès !");
            
            // g) Rediriger vers le dashboard (Étape 3)
            window.location.href = "../step3/step3.html";
        }
    </script>
</body>
</html>
